<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="一个可直接打开预览的简单中文静态 HTML 页面。" />
    <title>晨间工作台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b7a75'/%3E%3Ccircle cx='44' cy='20' r='10' fill='%23f2a93b'/%3E%3Cpath d='M14 44h36v8H14zM14 30h24v8H14z' fill='%23fffaf0'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: light;
        --ink: #1d2430;
        --muted: #5f6b7a;
        --paper: #fffaf0;
        --line: #d7c6a1;
        --accent: #0b7a75;
        --accent-strong: #075f5b;
        --sun: #f2a93b;
        --rose: #d95d55;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: Georgia, "Times New Roman", "Noto Serif SC", serif;
        background:
          linear-gradient(135deg, rgba(11, 122, 117, 0.08), transparent 38%),
          radial-gradient(circle at 80% 18%, rgba(242, 169, 59, 0.32), transparent 28%),
          var(--paper);
      }

      main {
        width: min(1120px, calc(100% - 32px));
        min-height: 100vh;
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(280px, 0.95fr);
        align-items: center;
        gap: clamp(32px, 7vw, 88px);
        padding: 44px 0;
      }

      .eyebrow {
        width: fit-content;
        margin: 0 0 22px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--accent-strong);
        font-size: 0.82rem;
        letter-spacing: 0;
        background: rgba(255, 255, 255, 0.48);
      }

      h1 {
        margin: 0;
        max-width: 720px;
        font-size: clamp(3rem, 8vw, 6.8rem);
        line-height: 0.92;
        letter-spacing: 0;
      }

      .intro {
        max-width: 560px;
        margin: 26px 0 0;
        color: var(--muted);
        font-size: clamp(1.05rem, 2vw, 1.25rem);
        line-height: 1.75;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 34px;
      }

      .primary-action,
      .secondary-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 22px;
        border-radius: 6px;
        font-family: "Noto Sans SC", "PingFang SC", sans-serif;
        font-size: 0.98rem;
        font-weight: 700;
        text-decoration: none;
        transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
      }

      .primary-action {
        color: #ffffff;
        background: var(--accent);
        box-shadow: 0 12px 26px rgba(11, 122, 117, 0.2);
      }

      .primary-action:hover {
        transform: translateY(-2px);
        background: var(--accent-strong);
        box-shadow: 0 16px 30px rgba(11, 122, 117, 0.26);
      }

      .secondary-action {
        color: var(--ink);
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.42);
      }

      .visual {
        position: relative;
        min-height: 520px;
        border-left: 1px solid var(--line);
        padding-left: clamp(20px, 4vw, 46px);
      }

      .visual img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 8px;
        box-shadow: 0 28px 64px rgba(55, 45, 30, 0.18);
      }

      .note {
        position: absolute;
        right: 0;
        bottom: 24px;
        width: min(280px, 82%);
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-family: "Noto Sans SC", "PingFang SC", sans-serif;
        background: rgba(255, 250, 240, 0.9);
        backdrop-filter: blur(8px);
      }

      .note strong {
        display: block;
        margin-bottom: 8px;
        color: var(--rose);
      }

      .note span {
        color: var(--muted);
        line-height: 1.6;
      }

      footer {
        grid-column: 1 / -1;
        border-top: 1px solid var(--line);
        padding-top: 18px;
        color: var(--muted);
        font-family: "Noto Sans SC", "PingFang SC", sans-serif;
        font-size: 0.92rem;
      }

      @media (max-width: 760px) {
        main {
          grid-template-columns: 1fr;
          align-items: start;
          padding: 36px 0 56px;
        }

        .visual {
          min-height: 0;
          border-left: 0;
          padding-left: 0;
        }

        .note {
          position: static;
          width: 100%;
          margin-top: 14px;
        }

        .primary-action,
        .secondary-action {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="page-title">
        <p class="eyebrow">简单、清爽、可直接打开</p>
        <h1 id="page-title">把今天整理得更有条理。</h1>
        <p class="intro">
          这是一个轻量的静态 HTML 页面，适合作为项目首页、个人展示页或小型活动入口。页面自包含样式，打开文件即可预览。
        </p>
        <div class="actions">
          <a class="primary-action" href="#start">开始查看</a>
          <a class="secondary-action" href="README.md">阅读说明</a>
        </div>
      </section>

      <section class="visual" id="start" aria-label="页面视觉预览">
        <img
          src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 900'%3E%3Crect width='720' height='900' fill='%23f8e8c8'/%3E%3Ccircle cx='566' cy='180' r='84' fill='%23f2a93b'/%3E%3Cpath d='M92 668c96-88 160-112 234-76 80 39 148 20 230-70 46-50 91-74 136-72v450H92z' fill='%230b7a75'/%3E%3Cpath d='M0 762c118-98 223-128 314-90 95 40 184 24 267-48 53-46 99-62 139-49v325H0z' fill='%23d95d55' fill-opacity='.82'/%3E%3Cpath d='M98 238h388M98 306h292M98 374h332' stroke='%231d2430' stroke-width='18' stroke-linecap='round' opacity='.82'/%3E%3Crect x='94' y='474' width='178' height='62' rx='8' fill='%231d2430'/%3E%3C/svg%3E"
          alt="暖色调的抽象页面插画"
        />
        <div class="note">
          <strong>今日重点</strong>
          <span>少一点复杂配置，多一点清晰表达。把核心内容放在第一屏，让访问者快速理解页面用途。</span>
        </div>
      </section>

      <footer>页面由单个 HTML 文件构成，可直接用于静态站点或本地预览。</footer>
    </main>
  </body>
</html>
